[project]
name = "sendermap"
version = "0.1.0.dev0"
description = "Type a domain, see every service that sends email as it, with the public evidence for each."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Neil Anuskiewicz" }]
requires-python = ">=3.12"
dependencies = [
    "dnspython>=2.7",
    "httpx>=0.28",
    "rich>=13.9",
]
keywords = ["email", "dns", "spf", "dkim", "dmarc", "deliverability"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Internet :: Name Service (DNS)",
    "Typing :: Typed",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.32"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-socket>=0.7",
    "mypy>=1.13",
    "ruff>=0.8",
    "pyyaml>=6",
    "types-pyyaml>=6",
]

[project.scripts]
sendermap = "sendermap.cli:main"

[project.urls]
Homepage = "https://github.com/marmot7775/sendermap"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sendermap"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: queries real DNS; run with -m live"]
addopts = "-m 'not live' --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["sendermap", "tests", "tools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR2004", "PLR0913"]
