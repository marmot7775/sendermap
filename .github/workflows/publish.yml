# Publish a release to PyPI when a tag v* is pushed, then make the GitHub release.
#
# PYPI_READY: publishing is held until the repository variable PYPI_READY is true. It is set
# under Settings, Secrets and variables, Actions, Variables, once the PyPI trusted publisher
# exists. Until then a v* tag still builds the sdist and wheel and uploads them as the workflow
# artifact "dist", and the publish and release jobs are skipped, not failed.
#
# build: the sdist and wheel with python -m build, from a full clone so hatch-vcs reads the tag,
#   checked to carry the tag's version; the tag's section of CHANGELOG.md becomes the release
#   notes, and a tag without one fails here, before anything is published.
# publish: uploads to PyPI by trusted publishing (no token: the pypi environment and the
#   id-token permission), with attestations.
# release: the GitHub release for the tag, with the notes and the built files.
# registry: lists the version in the MCP registry from server.json, signed in by this workflow's
#   GitHub identity (OIDC, no secret), once PyPI serves the version: the registry checks the
#   PyPI package's description for the README's mcp-name line. server.json must name the tag's
#   version, so a tag whose server.json was not bumped fails here, after PyPI.
# deploy: upgrades sendermap.dns-audit.com to the tag's version over SSH. The key in DEPLOY_SSH_KEY may run
#   only deploy/sendermap-upgrade on the droplet, which installs the version from PyPI (retrying
#   while the index lags), restarts the app and checks it serves that version. DEPLOY_HOST,
#   DEPLOY_USER and DEPLOY_KNOWN_HOSTS are repository secrets too.

name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # hatch-vcs takes the version from the tag
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Check the version is the tag's
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls dist
          test -f "dist/sendermap-${version}.tar.gz"
          test -f "dist/sendermap-${version}-py3-none-any.whl"
      - name: Release notes from CHANGELOG.md
        run: python tools/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  publish:
    needs: build
    if: vars.PYPI_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/sendermap
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "Sendermap ${GITHUB_REF_NAME#v}"
          --notes-file release-notes.md

  registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write  # signs in to the MCP registry as this repository
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Check server.json names the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version server.json)" = "$version"
          test "$(jq -r '.packages[0].version' server.json)" = "$version"
      - name: Wait for PyPI to serve the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 30); do
            curl -sf "https://pypi.org/pypi/sendermap/${version}/json" >/dev/null && exit 0
            sleep 10
          done
          exit 1
      - name: Install mcp-publisher
        run: >
          curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          | tar xz mcp-publisher
      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Upgrade sendermap.dns-audit.com
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes "$TARGET" "${GITHUB_REF_NAME#v}"
