# Run the suite on every push to main, on every pull request and by hand: ruff check, ruff
# format --check, mypy and pytest, on each supported Python. pytest takes its addopts from
# pyproject.toml, so the network is blocked here the same way it is locally. Any of the four
# failing fails the job.

name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,web]"  # web too: mypy and the web test read fastapi
      - name: ruff check
        run: ruff check
      - name: ruff format --check
        run: ruff format --check
      - name: mypy
        run: mypy
      - name: pytest
        run: pytest
