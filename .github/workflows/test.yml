# Run the suite on every push to main, on every pull request and by hand: ruff check, ruff
# format --check, mypy and pytest, on each supported Python, installed from uv.lock exactly.
# pytest takes its addopts from pyproject.toml, so the network is blocked here the same way it
# is locally. Any of the four failing fails the job.

name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra web  # web too: mypy and the web test read fastapi
      - name: ruff check
        run: uv run --no-sync ruff check
      - name: ruff format --check
        run: uv run --no-sync ruff format --check
      - name: mypy
        run: uv run --no-sync mypy
      - name: pytest
        run: uv run --no-sync pytest
